app = "pandaxpanther-prediction-bot"
primary_region = "dfw"  # Dallas - was Denver but Fly deprecated DEN region

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  TRADING_MODE = "paper"
  PERMISSIVE_PAPER = "true"
  PING_PAPER_FILLS = "true"  # ping Discord on every paper signal during early testing
  DAILY_LOSS_CAP_USD = "200"
  MAX_POSITION_PER_MARKET_USD = "250"
  PLATFORM_MODE = "kalshi_only"  # disables all Polymarket-dependent strategies
  # Kalshi-only strategy allocations
  ALLOC_WEATHER = "0.50"
  ALLOC_KALSHI_SUM_TO_ONE = "0.20"
  ALLOC_NOWCAST = "0.20"
  ALLOC_SPORTS_LATENCY = "0.10"
  KALSHI_HOST = "https://api.elections.kalshi.com/trade-api/v2"
  KALSHI_WSS = "wss://api.elections.kalshi.com/trade-api/ws/v2"
  NOAA_FORECAST_URL = "https://api.weather.gov"
  DISCORD_NOTIFY_USER_ID = "572590897150296083"
  # Point bot at deployed quant service for nowcast + sports models
  QUANT_SERVICE_URL = "https://pandaxpanther-quant.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Pure background worker - no HTTP service exposed publicly
