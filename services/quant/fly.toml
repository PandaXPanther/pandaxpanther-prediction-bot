app = "pandaxpanther-quant"
primary_region = "den"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # auto-sleeps when idle, wakes on demand
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
