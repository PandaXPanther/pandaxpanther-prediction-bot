app = "pandaxpanther-quant"
primary_region = "dfw"  # match the main bot region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # keep warm during paper testing; switch to 0 later for cost savings
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
